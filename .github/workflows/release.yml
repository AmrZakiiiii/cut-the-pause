name: Release

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  package-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Download Silero model
        run: ./scripts/download-silero-model.sh

      - name: Restore
        run: dotnet restore CutThePause.sln

      - name: Build
        run: dotnet build CutThePause.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CutThePause.sln --configuration Release --no-build

      - name: Publish app
        run: dotnet publish src/CutThePause.App/CutThePause.App.csproj --configuration Release --runtime osx-arm64 --self-contained true --output artifacts/publish/osx-arm64

      - name: Package .app bundle
        run: ./scripts/package-macos-app.sh artifacts/publish/osx-arm64 "$(brew --prefix ffmpeg)" artifacts/release

      - name: Zip artifact
        run: ditto -c -k --keepParent "artifacts/release/Cut The Pause.app" artifacts/release/CutThePause-macos-arm64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CutThePause-macos-arm64
          path: artifacts/release/CutThePause-macos-arm64.zip

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/CutThePause-macos-arm64.zip
